<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Lease End Party — Check In</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a120b; color: #f5ece0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 24px 20px 48px; }

    .logo { width: 52px; height: 52px; border-radius: 12px; margin-bottom: 16px; margin-top: 8px; }
    h1 { font-size: 1.6rem; font-weight: 800; color: #f5d080; text-align: center; margin-bottom: 4px; }
    .subtitle { font-size: 0.95rem; color: #c9a96e; text-align: center; margin-bottom: 32px; }

    .card { background: #2a1a0e; border: 1px solid #4a3020; border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 420px; }

    label { display: block; font-size: 0.82rem; color: #a89070; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }

    input[type="email"], input[type="text"] {
      width: 100%; padding: 16px 18px; font-size: 1.05rem; border-radius: 10px;
      border: 2px solid #4a3020; background: #1a120b; color: #f5ece0; outline: none;
      transition: border-color 0.2s; margin-bottom: 16px;
    }
    input:focus { border-color: #b8860b; }
    input::placeholder { color: #6a5040; }

    .btn-primary {
      width: 100%; padding: 18px; font-size: 1.1rem; font-weight: 700;
      background: #b8860b; color: #1a120b; border: none; border-radius: 12px;
      cursor: pointer; transition: background 0.15s; letter-spacing: 0.02em;
    }
    .btn-primary:hover { background: #d4a012; }
    .btn-primary:active { background: #96700a; }
    .btn-primary:disabled { background: #4a3020; color: #6a5040; cursor: default; }

    .btn-secondary {
      width: 100%; padding: 14px; font-size: 0.95rem; font-weight: 600;
      background: transparent; color: #c9a96e; border: 1px solid #4a3020; border-radius: 10px;
      cursor: pointer; margin-top: 10px; transition: background 0.15s;
    }
    .btn-secondary:hover { background: rgba(184,134,11,0.1); }

    .error-msg { color: #ff8070; font-size: 0.88rem; margin-top: 6px; min-height: 20px; }

    /* Success screen */
    .success-screen { text-align: center; }
    .check-circle { font-size: 4rem; margin-bottom: 12px; }
    .welcome-name { font-size: 1.8rem; font-weight: 800; color: #f5d080; margin-bottom: 6px; }
    .welcome-sub { font-size: 1rem; color: #c9a96e; margin-bottom: 28px; }

    .vip-badge {
      display: inline-block; background: #b8860b; color: #1a120b;
      font-weight: 800; font-size: 0.8rem; padding: 4px 12px;
      border-radius: 20px; letter-spacing: 0.1em; margin-bottom: 20px;
    }

    .plusone-box {
      background: #1a120b; border: 2px solid #4a3020; border-radius: 14px;
      padding: 20px; margin-bottom: 16px;
    }
    .plusone-box p { font-size: 1rem; color: #c9a96e; margin-bottom: 16px; line-height: 1.5; }
    .plusone-btns { display: flex; gap: 10px; }
    .plusone-btns button {
      flex: 1; padding: 14px; font-size: 0.95rem; font-weight: 700;
      border-radius: 10px; border: 2px solid; cursor: pointer; transition: all 0.15s;
    }
    .btn-yes { background: rgba(60,160,60,0.15); border-color: #4caf50; color: #90ee90; }
    .btn-yes:hover, .btn-yes.selected { background: rgba(60,160,60,0.3); }
    .btn-no { background: rgba(100,80,60,0.2); border-color: #6a5040; color: #9a8060; }
    .btn-no:hover, .btn-no.selected { background: rgba(100,80,60,0.4); }

    .already-badge {
      background: rgba(60,160,60,0.15); border: 1px solid rgba(80,180,80,0.4);
      border-radius: 10px; padding: 14px 18px; color: #90ee90;
      font-size: 0.95rem; margin-bottom: 16px;
    }

    /* Fallback name search */
    .fallback { margin-top: 20px; text-align: center; }
    .fallback p { font-size: 0.88rem; color: #7a6050; margin-bottom: 12px; }

    .search-results { margin-top: 12px; }
    .result-item {
      background: #1a120b; border: 1px solid #3a2510; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      transition: background 0.15s;
    }
    .result-item:hover { background: rgba(184,134,11,0.1); border-color: #b8860b; }
    .result-name { font-weight: 600; font-size: 1rem; }
    .result-arrow { color: #6a5040; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <img src="/le-logo.png" class="logo" alt="LE">
  <h1>Welcome! 🤠</h1>
  <p class="subtitle">Lease End Party · Saturday, June 6</p>

  <!-- Email check-in screen -->
  <div class="card" id="emailScreen">
    <label for="emailInput">Your work email address</label>
    <input type="email" id="emailInput" placeholder="you@leaseend.com" autocomplete="email" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="error-msg" id="emailError"></div>
    <button class="btn-primary" id="checkinBtn" onclick="doEmailCheckin()">Check Me In 🤠</button>
    <p style="font-size:0.8rem;color:#5a4030;text-align:center;margin-top:12px;">Email not working? See a staff member at the check-in desk.</p>
  </div>

  <!-- Success screen -->
  <div class="card success-screen hidden" id="successScreen">
    <div class="check-circle">✅</div>
    <div class="welcome-name" id="successName"></div>
    <div id="vipBadge" class="vip-badge hidden">⭐ VIP Guest</div>
    <div class="welcome-sub">You're checked in — enjoy the party!</div>

    <div class="plusone-box" id="plusoneBox">
      <p>Did you bring a <strong>+1</strong> tonight?</p>
      <div class="plusone-btns">
        <button class="btn-yes" id="btnYes" onclick="setPlusOne(true)">Yes, +1 with me</button>
        <button class="btn-no" id="btnNo" onclick="setPlusOne(false)">Just me</button>
      </div>
    </div>

  </div>

  <!-- Already checked in screen -->
  <div class="card success-screen hidden" id="alreadyScreen">
    <div class="check-circle">🎉</div>
    <div class="welcome-name" id="alreadyName"></div>
    <div class="welcome-sub">You're already checked in — go have fun!</div>
  </div>

<script>
const GUESTS = [];  // populated from server

let currentEmail = null;
let plusOneSet = false;

async function doEmailCheckin() {
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  if (!email) { showError('Please enter your email address.'); return; }

  const btn = document.getElementById('checkinBtn');
  btn.disabled = true; btn.textContent = 'Checking in…';

  try {
    const r = await fetch('/api/self-checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await r.json();

    if (r.status === 404) {
      showError("Email not found. Please see a staff member at the check-in desk.");
      btn.disabled = false; btn.textContent = 'Check Me In 🤠';
      return;
    }
    if (data.already) {
      showAlready(data.name);
      return;
    }
    if (data.success) {
      currentEmail = email;
      showSuccess(data.name, data.vip);
      return;
    }
  } catch(e) {
    showError('Connection error — please try again or see staff.');
  }
  btn.disabled = false; btn.textContent = 'Check Me In 🤠';
}

function showError(msg) {
  document.getElementById('emailError').textContent = msg;
}

function showSuccess(name, vip) {
  hide('emailScreen');
  document.getElementById('successName').textContent = name;
  if (vip) show('vipBadge'); else hide('vipBadge');
  show('successScreen');
  plusOneSet = false;
  document.getElementById('btnYes').classList.remove('selected');
  document.getElementById('btnNo').classList.remove('selected');
}

function showAlready(name) {
  hide('emailScreen');
  document.getElementById('alreadyName').textContent = name;
  show('alreadyScreen');
}

async function setPlusOne(val) {
  if (!currentEmail) return;
  document.getElementById('btnYes').classList.toggle('selected', val);
  document.getElementById('btnNo').classList.toggle('selected', !val);
  await fetch('/api/self-plusone', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: currentEmail, value: val }),
  });
}

function reset() {
  currentEmail = null;
  hide('successScreen'); hide('alreadyScreen');
  document.getElementById('emailInput').value = '';
  document.getElementById('emailError').textContent = '';
  document.getElementById('checkinBtn').disabled = false;
  document.getElementById('checkinBtn').textContent = 'Check Me In 🤠';
  show('emailScreen');
  document.getElementById('emailInput').focus();
}

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

// Allow Enter key to submit
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doEmailCheckin();
  });
});
</script>

</body>
</html>
